name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest tests/ -q --tb=short --cov=src/ecoalign_forge --cov-report=term-missing

      - name: Build distributions and run installed demo outside checkout
        run: |
          python -m hatchling build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          # Missing external facts make four recorded cases abstain (exit 3).
          demo_exit=0
          ecoalign-forge --demo --num-samples 5 || demo_exit=$?
          test "$demo_exit" -eq 3

      - name: Deterministic success and controlled failure evidence
        run: |
          python scripts/accept_iteration_a.py --output /tmp/ecoalign-acceptance-a
          python scripts/accept_iteration_b.py --output /tmp/ecoalign-acceptance-b

  consumers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        consumer: [trl, llamafactory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Build deterministic dataset
        run: |
          uv venv /tmp/kernel
          uv pip install --python /tmp/kernel/bin/python -e '.[dev]'
          /tmp/kernel/bin/python scripts/accept_iteration_b.py --output /tmp/acceptance --skip-fault-tests
      - name: Install isolated locked consumer
        run: |
          uv venv /tmp/consumer
          uv pip install --python /tmp/consumer/bin/python --torch-backend cpu -r scripts/consumers/${{ matrix.consumer }}.lock
      - name: Actual loader, template, tokenizer and collator
        run: |
          DATASET=$(find /tmp/acceptance/datasets/demo -name manifest.json -print -quit)
          /tmp/consumer/bin/python scripts/consumers/verify.py ${{ matrix.consumer }} "$(dirname "$DATASET")" --output /tmp/${{ matrix.consumer }}-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-${{ matrix.consumer }}
          path: /tmp/${{ matrix.consumer }}-acceptance.json
