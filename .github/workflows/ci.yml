name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest tests/ -q --tb=short --cov=src/ecoalign_forge --cov-report=term-missing

      - name: Build distributions and run installed demo outside checkout
        run: |
          python -m hatchling build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          ecoalign-forge --demo --num-samples 5

      - name: Deterministic success and controlled failure evidence
        run: python scripts/accept_iteration_a.py --output /tmp/ecoalign-acceptance
